<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaimanas Practical Test By Jiratchaya Kongmaung</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="header">
        <div id="language">
            <button class="lang-btn">TH - THB <span class="arrow"></span></button>
            <div id="lang-option" class="lang-option">
                <button class="lang-select">US - USD</button>
            </div>
        </div>
        <div class="menu">
            <a href="#women" class="menu-item menu-btn">WOMEN</a>
            <a href="#collection" class="menu-item menu-btn">COLLECTIONS</a>
            <a href="#editorial" id="editorial-menu" class="menu-item menu-btn">EDITORIAL</a>
            <a href="#news" class="menu-item menu-btn">NEWS</a>
            <a href="#stories" class="menu-item menu-btn">STORIES</a>
        </div>
        <div class="right-content">
            <a href="#sign-in" class="menu-item sign-in-btn">SIGN IN</a>
            <a href="#cart" class="menu-item"><img src="/images/shopping-bag.svg" alt="shopping bag"/></a>
        </div>
    </header>
    <div class="editorial-dropdown-container">
        <div id="editorial-dropdown" class="editorial-dropdown">
            <span class="editorial-title">EDITORIAL</span>
            <div class="editorial-sub-menu-container">
                <a href="#asc" class="editorial-sub-menu">A.S.C</a>
                <a href="#bazaar" class="editorial-sub-menu">BAZAAR</a>
                <a href="#elle" class="editorial-sub-menu">ELLE</a>
                <a href="#gq" class="editorial-sub-menu">GQ</a>
            </div>
        </div>
    </div>
    <img id="logo" class="header-font logo" src="/images/logo.png" alt="Plaimanas Logo">
    <main>
        <section id="banner-section" class="hero-banner">
        <video autoplay muted loop>
        <source src="videos/banner.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </section>
    </main>
</body>
</html>
